name: Deploy dashboard

on:
  push:
    branches: ["main"]
  schedule:
    # 06:35 UTC = 15:35 KST / 14:35 China time.
    # KCS/TRASS update windows: monthly preliminary on the 1st,
    # 1-10 day high-frequency release around the 11th,
    # monthly HS/final detail around the 15th,
    # and 1-20 day high-frequency release around the 21st.
    - cron: "35 6 1,11,15,21 * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh dashboard data
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: npm run fetch
      - name: Validate JavaScript
        run: npm run check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
