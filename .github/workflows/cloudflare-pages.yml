name: Refresh data and deploy Cloudflare Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "35 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deployment tools
        run: npm install --no-package-lock

      - name: Refresh dashboard data
        if: github.event_name != 'push'
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: npm run fetch

      - name: Validate JavaScript
        run: npm run check

      - name: Detect refreshed data
        id: data_changes
        run: |
          if git diff --quiet -- data/trade-data.json public/data/trade-data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit refreshed data
        if: github.event_name != 'push' && steps.data_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trade-data.json public/data/trade-data.json
          git commit -m "Refresh trade data"
          git push

      - name: Deploy Cloudflare Pages
        if: github.event_name == 'push' || steps.data_changes.outputs.changed == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:cf

      - name: Report no newer data
        if: github.event_name != 'push' && steps.data_changes.outputs.changed == 'false'
        run: echo "No refreshed data changes detected; skipped Cloudflare deploy."
